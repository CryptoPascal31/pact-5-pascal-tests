name: WASM Build

on:
  workflow_dispatch:
  push:

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Native GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16

      - name: Install WASM GHC Toolchain
        run: |
          curl https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | sh
          ~/.ghc-wasm/add_to_github_path.sh
          echo "SYSROOT=$HOME/.ghc-wasm/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"


      - name: Prepare dirs
        run: mkdir -p ${{ github.workspace }}/external-deps


      - name: Build GMP
        working-directory: ${{ github.workspace }}/external-deps
        env:
          CFLAGS: -O2 -D_WASI_EMULATED_SIGNAL -fPIC
          LDFLAGS: -lwasi-emulated-signal

        run: |
          wget https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xJf gmp-6.3.0.tar.xz
          cd gmp-6.3.0
          ./configure --host=wasm32-wasi --prefix="$SYSROOT" --libdir="$SYSROOT/lib/wasm32-wasi" \
                      --disable-assembly --disable-shared --enable-static

          make
          make install

      - name: Build MPFR
        working-directory: ${{ github.workspace }}/external-deps
        env:
          CFLAGS: -O2  -fPIC
        run: |
          wget https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
          tar xJf mpfr-4.2.2.tar.xz
          cd mpfr-4.2.2

          ./configure --host=wasm32-wasi --prefix="$SYSROOT" --libdir="$SYSROOT/lib/wasm32-wasi" \
                      --disable-shared --enable-static

          make
          make install

      - name: Install native Alex and Happy
        run: |
          cabal install happy alex


      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          wasm32-wasi-cabal build --project-file=cabal.project.wasi lib:pact-tng --only-dependencies